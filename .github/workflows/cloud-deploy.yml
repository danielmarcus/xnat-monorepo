# Cloud Deploy Workflow
#
# Triggered automatically after a successful smoke-test run on the main branch.
# Uses Terraform to provision/update cloud infrastructure, deploys the WAR,
# and runs a final smoke-test pass against the live cloud endpoint.
#
# The workflow is skipped gracefully when AWS credentials are absent, so it is
# safe to keep in the repository even before cloud infrastructure is set up.
#
# The deployed environment is intentionally NOT torn down after the job so
# that the running instance can serve as a staging/QA environment.
#
# Required secrets (all optional — workflow skips gracefully when absent):
#   AWS_ACCESS_KEY_ID      — AWS access key for Terraform + deployment
#   AWS_SECRET_ACCESS_KEY  — AWS secret key
#   AWS_REGION             — Target AWS region (default: us-east-2)
#   TF_BACKEND_BUCKET      — S3 bucket for Terraform remote state
#   TF_BACKEND_KEY         — S3 key for Terraform state file
#   TF_BACKEND_REGION      — Region of the state bucket (defaults to AWS_REGION)
#   CLOUD_SSH_KEY          — Private SSH key for ec2-user on the XNAT instance
#   XNAT_CLOUD_HOST        — Hostname / IP of the deployed XNAT instance
#   XNAT_CLOUD_ADMIN_PASS  — Admin password set during provisioning
#
# See CI_SECRETS.md for the full secrets reference.

name: Cloud Deploy

on:
  workflow_dispatch:  # Allow manual triggering
  workflow_run:
    workflows:
      - "Smoke Tests"
    types:
      - completed

permissions:
  contents: read
  actions: read   # download artifacts from the triggering run
  id-token: write # required for OIDC-based AWS auth (future enhancement)

env:
  TF_DIR: deploy/cloud/terraform
  SCRIPTS_DIR: deploy/cloud/scripts
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}

jobs:
  # ---------------------------------------------------------------------------
  # Guard job — check that we should proceed before doing any real work.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    # Run on manual dispatch or successful smoke tests on main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    outputs:
      should-deploy: ${{ steps.check-creds.outputs.proceed }}

    steps:
      - name: Check AWS credentials
        id: check-creds
        run: |
          if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS credentials found — cloud deploy will proceed."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_ACCESS_KEY_ID secret not set — skipping cloud deploy."
          fi

  # ---------------------------------------------------------------------------
  # Main deploy job
  # ---------------------------------------------------------------------------
  deploy:
    name: Terraform + Deploy WAR
    needs: preflight
    if: needs.preflight.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: cloud-staging

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout at the same SHA that was smoke-tested
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Configure AWS credentials
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # 3. Find the latest successful Main Build run and download its artifacts
      # -----------------------------------------------------------------------
      - name: Find latest Main Build run
        id: find-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow main-build.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using Main Build run: $RUN_ID"

      - name: Download build-info artifact
        uses: actions/download-artifact@v4
        with:
          name: build-info
          path: /tmp/build-info
          run-id: ${{ steps.find-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load build-info into environment
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            key="$(echo "$key" | xargs)"
            value="$(echo "$value" | xargs)"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < /tmp/build-info/build-info.env

      # -----------------------------------------------------------------------
      # 4. Download the WAR from the main-build run referenced in build-info
      # -----------------------------------------------------------------------
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WAR_ARTIFACT_NAME }}
          path: /tmp/war
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage WAR
        run: |
          mkdir -p apps/web/build/libs
          cp /tmp/war/web-1.10.0-RC2-SNAPSHOT.war apps/web/build/libs/

      # -----------------------------------------------------------------------
      # 5. Terraform setup
      # -----------------------------------------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # keep raw output for script parsing

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ secrets.TF_BACKEND_REGION || env.AWS_REGION }}" \
            -input=false

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -input=false \
            -var="aws_region=${{ secrets.AWS_REGION || 'us-east-2' }}" \
            -var="key_name=github-actions-xnat" \
            -var="git_sha=${{ env.GIT_SHA }}"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan

      - name: Export Terraform outputs
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          INSTANCE_IP=$(terraform output -raw public_ip)
          echo "instance_ip=${INSTANCE_IP}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 6. Deploy WAR to the provisioned instance
      # -----------------------------------------------------------------------
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/cloud_deploy_key
          chmod 600 ~/.ssh/cloud_deploy_key
          ssh-keyscan -H "${{ steps.tf-outputs.outputs.instance_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy WAR to cloud instance
        env:
          INSTANCE_IP: ${{ steps.tf-outputs.outputs.instance_ip }}
          SSH_KEY: ~/.ssh/cloud_deploy_key
        run: |
          # Prefer a deployment script; fall back to SCP + remote Docker Compose restart.
          if [[ -f "${SCRIPTS_DIR}/deploy.sh" ]]; then
            SSH_KEY="${SSH_KEY}" bash "${SCRIPTS_DIR}/deploy.sh" \
              apps/web/build/libs/web-1.10.0-RC2-SNAPSHOT.war \
              "${INSTANCE_IP}"
          else
            echo "::notice::No deploy.sh found — copying WAR directly via SCP."
            scp -i "${SSH_KEY}" -o StrictHostKeyChecking=no \
              apps/web/build/libs/web-1.10.0-RC2-SNAPSHOT.war \
              "ec2-user@${INSTANCE_IP}:/home/ec2-user/xnat/apps/web/build/libs/web-1.10.0-RC2-SNAPSHOT.war"
            ssh -i "${SSH_KEY}" -o StrictHostKeyChecking=no "ec2-user@${INSTANCE_IP}" \
              "cd /home/ec2-user/xnat && docker compose up -d --no-deps --build xnat"
          fi

      # -----------------------------------------------------------------------
      # 7. Wait for the cloud XNAT to become ready after deployment
      # -----------------------------------------------------------------------
      - name: Wait for cloud XNAT readiness
        run: |
          XNAT_HOST="${{ steps.tf-outputs.outputs.instance_ip }}"
          XNAT_URL="http://${XNAT_HOST}/xnat"
          MAX_WAIT=300
          INTERVAL=10
          elapsed=0
          echo "Polling ${XNAT_URL} for XNAT readiness..."
          until curl --silent --fail --output /dev/null "${XNAT_URL}/app/template/Login.vm"; do
            if (( elapsed >= MAX_WAIT )); then
              echo "::error::Cloud XNAT did not become ready within ${MAX_WAIT}s."
              exit 1
            fi
            echo "  waiting... (${elapsed}s elapsed)"
            sleep $INTERVAL
            (( elapsed += INTERVAL ))
          done
          echo "Cloud XNAT is ready after ${elapsed}s."

      # -----------------------------------------------------------------------
      # 8. Run smoke tests against the cloud endpoint
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f smoke-tests/requirements.txt ]]; then
            pip install -r smoke-tests/requirements.txt
          else
            pip install pytest requests pytest-html
          fi

      - name: Run cloud smoke tests
        run: |
          pytest smoke-tests/ \
            --junitxml=cloud-smoke-test-results.xml \
            --html=cloud-smoke-test-report.html \
            --self-contained-html \
            -v
        env:
          XNAT_BASE_URL: http://${{ steps.tf-outputs.outputs.instance_ip }}/xnat
          XNAT_USER: admin
          XNAT_PASS: ${{ secrets.XNAT_CLOUD_ADMIN_PASS }}

      # -----------------------------------------------------------------------
      # 9. Upload smoke-test results
      # -----------------------------------------------------------------------
      - name: Upload cloud smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-smoke-test-results-${{ env.GIT_SHA_SHORT }}
          path: |
            cloud-smoke-test-results.xml
            cloud-smoke-test-report.html
          retention-days: 30

      # NOTE: The cloud environment is NOT torn down — it remains running as a
      # staging / QA environment.  Use terraform destroy manually when needed.
