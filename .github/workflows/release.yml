# Release Workflow
#
# Manually triggered via workflow_dispatch.  Accepts a version string as input,
# tags the current HEAD commit, runs a full build, creates a GitHub Release with
# the WAR attached, and optionally publishes to Artifactory.
#
# GPG signing is attempted when the signing secrets are present; the workflow
# degrades gracefully (skips signing, posts a notice) when they are absent.
# Artifactory publish likewise skips gracefully when credentials are absent.
#
# Required inputs (workflow_dispatch):
#   version — Release version, e.g. "1.10.0-RC2"
#
# Required secrets (all optional — workflow degrades gracefully):
#   XNAT_ARTIFACTORY_USER  — Artifactory username
#   XNAT_ARTIFACTORY_TOKEN — Artifactory API token / password
#   GPG_PRIVATE_KEY        — ASCII-armored GPG private key for signing artifacts
#   GPG_PASSPHRASE         — Passphrase for the GPG private key
#
# See CI_SECRETS.md for the full secrets reference.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Release version (e.g. "1.10.0-RC2" or "1.10.0").
          Must be a valid SemVer or XNAT release tag.
        required: true
        type: string

      prerelease:
        description: Mark this GitHub Release as a pre-release
        required: false
        type: boolean
        default: false

      draft:
        description: Create GitHub Release as a draft (publish manually later)
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # create tags and GitHub Releases
  actions: read

jobs:
  release:
    name: Tag, Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # -----------------------------------------------------------------------
      # 1. Validate the version string
      # -----------------------------------------------------------------------
      - name: Validate version input
        run: |
          VERSION="${{ inputs.version }}"
          # Accept SemVer optionally prefixed with 'v', plus -RC/-SNAPSHOT suffixes.
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Version '${VERSION}' does not match expected pattern (e.g. 1.10.0-RC2)."
            exit 1
          fi
          # Normalise: strip leading 'v' for internal use; keep 'v'-prefixed tag.
          NORMALIZED="${VERSION#v}"
          TAG="v${NORMALIZED}"
          echo "VERSION=${NORMALIZED}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}"            >> "$GITHUB_ENV"
          echo "Version: ${NORMALIZED}, Tag: ${TAG}"

      # -----------------------------------------------------------------------
      # 2. Checkout full history so we can tag and push
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT if available so the pushed tag triggers other workflows;
          # fall back to GITHUB_TOKEN (pushed tags won't trigger workflows).
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 3. Configure git identity for the tag commit
      # -----------------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # 4. Create and push the release tag
      # -----------------------------------------------------------------------
      - name: Create release tag
        run: |
          if git rev-parse "${{ env.TAG }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ env.TAG }} already exists."
            exit 1
          fi
          git tag \
            -a "${{ env.TAG }}" \
            -m "Release ${{ env.TAG }}" \
            "${{ github.sha }}"
          git push origin "${{ env.TAG }}"
          echo "::notice::Tag ${{ env.TAG }} created and pushed."

      # -----------------------------------------------------------------------
      # 5. Java 21 (Temurin)
      # -----------------------------------------------------------------------
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # -----------------------------------------------------------------------
      # 6. Gradle — read-only cache (release builds must be reproducible)
      # -----------------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # -----------------------------------------------------------------------
      # 7. Full release build
      # -----------------------------------------------------------------------
      - name: Build release WAR
        run: |
          ./gradlew build \
            -Pversion="${{ env.VERSION }}" \
            --no-daemon \
            --continue
        env:
          GRADLE_OPTS: "-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"

      # -----------------------------------------------------------------------
      # 8. Locate the built WAR (version in filename may vary)
      # -----------------------------------------------------------------------
      - name: Locate WAR artifact
        id: locate-war
        run: |
          WAR_PATH="$(find apps/web/build/libs -name '*.war' | head -1)"
          if [[ -z "$WAR_PATH" ]]; then
            echo "::error::No WAR file found under apps/web/build/libs/"
            exit 1
          fi
          WAR_FILENAME="$(basename "$WAR_PATH")"
          echo "path=${WAR_PATH}"       >> "$GITHUB_OUTPUT"
          echo "filename=${WAR_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Found WAR: ${WAR_PATH}"

      # -----------------------------------------------------------------------
      # 9. Optional: import GPG key and sign the WAR
      # -----------------------------------------------------------------------
      - name: Check GPG credentials
        id: gpg-check
        run: |
          if [[ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GPG_PRIVATE_KEY secret not set — artifact signing will be skipped."
          fi

      - name: Import GPG private key
        if: steps.gpg-check.outputs.present == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign WAR artifact
        if: steps.gpg-check.outputs.present == 'true'
        run: |
          gpg --batch \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --detach-sign \
              --armor \
              "${{ steps.locate-war.outputs.path }}"
          echo "::notice::Signature created: ${{ steps.locate-war.outputs.path }}.asc"

      # -----------------------------------------------------------------------
      # 10. Generate SHA-256 checksum for the WAR
      # -----------------------------------------------------------------------
      - name: Generate checksum
        run: |
          WAR="${{ steps.locate-war.outputs.path }}"
          sha256sum "$WAR" | tee "${WAR}.sha256"

      # -----------------------------------------------------------------------
      # 11. Create GitHub Release and attach assets
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: XNAT ${{ env.VERSION }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.locate-war.outputs.path }}
            ${{ steps.locate-war.outputs.path }}.sha256
            ${{ steps.locate-war.outputs.path }}.asc
          fail_on_unmatched_files: false   # .asc may not exist if signing skipped

      # -----------------------------------------------------------------------
      # 12. Optional: publish release to Artifactory
      # -----------------------------------------------------------------------
      - name: Check Artifactory credentials
        id: artifactory-check
        run: |
          if [[ -n "${{ secrets.XNAT_ARTIFACTORY_USER }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XNAT_ARTIFACTORY_USER secret not set — skipping Artifactory publish."
          fi

      - name: Publish release to Artifactory
        if: steps.artifactory-check.outputs.present == 'true'
        run: |
          ./gradlew artifactoryPublish \
            -Pversion="${{ env.VERSION }}" \
            --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          ORG_GRADLE_PROJECT_artifactoryUser: ${{ secrets.XNAT_ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_artifactoryToken: ${{ secrets.XNAT_ARTIFACTORY_TOKEN }}

      # -----------------------------------------------------------------------
      # 13. Upload WAR as a workflow artifact (convenience for downstream use)
      # -----------------------------------------------------------------------
      - name: Upload WAR workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xnat-web-war-${{ env.TAG }}
          path: |
            ${{ steps.locate-war.outputs.path }}
            ${{ steps.locate-war.outputs.path }}.sha256
          retention-days: 90
