[pytest]
# ---------------------------------------------------------------------------
# XNAT Smoke Test Suite — pytest configuration
# ---------------------------------------------------------------------------

# Default options applied to every invocation.
# --junitxml writes a JUnit-compatible XML report consumed by CI systems.
# --strict-markers makes typos in @pytest.mark.* fail the run instead of
# silently producing a warning, so unmarked tests don't slip past the
# fast/full split in CI.
addopts =
    --junitxml=build/test-results/smoke-tests.xml
    -v
    --tb=short
    --strict-markers

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers declared here suppress the PytestUnknownMarkWarning.
markers =
    smoke: mark a test as part of the smoke test suite
    slow: long-running tests (>5s) — DICOM upload, container ops, large fixtures
    dicom: requires DICOM fixtures (synthetic or zipped study)
    container_service: requires the XNAT container service to be configured
