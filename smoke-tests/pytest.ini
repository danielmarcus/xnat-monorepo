[pytest]
# ---------------------------------------------------------------------------
# XNAT Smoke Test Suite — pytest configuration
# ---------------------------------------------------------------------------

# Default options applied to every invocation.
# --junitxml writes a JUnit-compatible XML report consumed by CI systems
# (GitHub Actions, Jenkins, GitLab CI, etc.).
addopts =
    --junitxml=build/test-results/smoke-tests.xml
    -v
    --tb=short

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers declared here suppress the PytestUnknownMarkWarning.
markers =
    smoke: mark a test as part of the smoke test suite
    slow: mark a test as potentially slow (e.g., waits for XNAT startup)
