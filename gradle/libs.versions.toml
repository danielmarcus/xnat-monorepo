# =============================================================================

# Convenience bundles — import multiple related libraries in one declaration.

spring-web-stack = [
    "spring-core",
    "spring-beans",
    "spring-context",
    "spring-web",
    "spring-webmvc",
    "spring-aop",
    "spring-tx",
]

