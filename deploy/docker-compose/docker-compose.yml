# XNAT Docker Compose deployment stack
# WAR file is built at: apps/web/build/libs/web-1.10.0-RC2-SNAPSHOT.war
# and mounted into Tomcat as ROOT.war.

services:
  xnat-db:
    image: postgres:15-alpine
    container_name: xnat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: xnat
      POSTGRES_USER: xnat
      POSTGRES_PASSWORD: xnat
    volumes:
      - xnat-db-data:/var/lib/postgresql/data
    networks:
      - xnat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnat -d xnat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  xnat-web:
    build:
      context: ./xnat
      args:
        XNAT_ROOT: /data/xnat
        XNAT_HOME: /data/xnat/home
        XNAT_DATASOURCE_DRIVER: org.postgresql.Driver
        XNAT_DATASOURCE_URL: jdbc:postgresql://xnat-db:5432/xnat
        XNAT_DATASOURCE_USERNAME: xnat
        XNAT_DATASOURCE_PASSWORD: xnat
        XNAT_EMAIL: ${XNAT_ADMIN_EMAIL:-admin@example.com}
        TOMCAT_XNAT_FOLDER: ROOT
    container_name: xnat-web
    restart: unless-stopped
    depends_on:
      xnat-db:
        condition: service_healthy
    ports:
      - "${XNAT_PORT:-80}:8080"
    environment:
      XNAT_HOME: /data/xnat/home
      XNAT_DATASOURCE_USERNAME: xnat
      PGPASSWORD: xnat
      CATALINA_OPTS: >-
        -Xms512m
        -Xmx2g
        -Xss512k
        -Dxnat.home=/data/xnat/home
        -Dxnat.config=/data/xnat/home/config/xnat-conf.properties
    volumes:
      # Deploy the locally built WAR. Long-form bind mount with
      # bind.create_host_path: false makes Docker refuse to start the
      # container when the WAR doesn't exist on the host, instead of
      # silently creating a stub directory at the source path.
      #
      # The stub-dir behaviour was a recurring papercut: running
      # `docker compose up` before `./gradlew :apps:web:war` made Docker
      # create
      #   apps/web/build/libs/web-1.10.0-RC2-SNAPSHOT.war/  (directory)
      # which then made every subsequent `./gradlew :apps:web:war` fail
      # ("cannot write file to existing directory"). With this flag,
      # `docker compose up` fails early with a clear error
      # ("bind source path does not exist"), keeping the host tree clean.
      #
      # Phase C.1: target /opt/xnat-input/ROOT.war is the staging path
      # the jakarta-migrate-and-start entrypoint reads; it writes the
      # migrated jakarta-typed copy into webapps/.
      - type: bind
        source: ../../apps/web/build/libs/web-1.10.0-RC2-SNAPSHOT.war
        target: /opt/xnat-input/ROOT.war
        read_only: true
        bind:
          create_host_path: false
      # XNAT configuration (overrides the build-time generated config)
      - ./xnat-conf/xnat-conf.properties:/data/xnat/home/config/xnat-conf.properties:ro
      # Persistent archive storage
      - xnat-archive:/data/xnat/archive
      # Build / cache dirs
      - xnat-build:/data/xnat/build
      - xnat-cache:/data/xnat/cache
    networks:
      - xnat-network
    healthcheck:
      # /xapi/siteConfig requires admin auth in this XNAT release (returns 401
      # to anonymous wget --spider, which is why the previous probe always
      # reported 'unhealthy'). /xapi/siteConfig/buildInfo is the unauth
      # endpoint we use for the same purpose in the K8s readiness probe and
      # the smoke-test fixtures (see Phase A finding).
      test:
        - "CMD-SHELL"
        - >
          wget --quiet --spider --server-response
          http://localhost:8080/xapi/siteConfig/buildInfo 2>&1
          | grep -q '200 OK'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

networks:
  xnat-network:
    driver: bridge

volumes:
  xnat-db-data:
    driver: local
  xnat-archive:
    driver: local
  xnat-build:
    driver: local
  xnat-cache:
    driver: local
