# XNAT configuration properties
# This file is mounted read-only into the container at:
#   /data/xnat/home/config/xnat-conf.properties
#
# Values here must match the environment variables set in docker-compose.yml.

# ---------------------------------------------------------------------------
# Database connection (PostgreSQL)
# ---------------------------------------------------------------------------
datasource.driver=org.postgresql.Driver
datasource.url=jdbc:postgresql://xnat-db:5432/xnat
datasource.username=xnat
datasource.password=xnat

# Connection pool settings
datasource.initialSize=5
datasource.maxActive=50
datasource.maxIdle=10
datasource.minIdle=5
datasource.validationQuery=SELECT 1

# ---------------------------------------------------------------------------
# Hibernate / JPA
# ---------------------------------------------------------------------------
hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.cache.use_second_level_cache=true
hibernate.cache.use_query_cache=true

# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
# Overridden at runtime via XNAT_SITE_URL env var; kept here as a fallback.
siteUrl=http://localhost

# ---------------------------------------------------------------------------
# Admin account (applied only during first-time initialisation)
# ---------------------------------------------------------------------------
site.adminUsername=admin
site.adminPassword=admin
site.adminEmail=admin@example.com

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# Do not require e-mail verification in development / CI environments.
require.login=true
security.channel=any

# ---------------------------------------------------------------------------
# Storage paths
# ---------------------------------------------------------------------------
archive.path=/data/xnat/archive
build.path=/data/xnat/build
cache.path=/data/xnat/cache
inbox.path=/data/xnat/inbox
