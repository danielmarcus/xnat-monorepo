{{/*
DB credentials Secret — only rendered when no existing Secret was provided
AND in-cluster Postgres is in use. With external RDS, eks-deploy.sh creates
the Secret outside Helm so the password isn't materialised in the release
manifest. With existingSecretName set explicitly, we trust the operator and
don't overwrite.
*/}}
{{- if and (not .Values.database.existingSecretName) .Values.inClusterPostgres.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xnat.fullname" . }}-db
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
type: Opaque
data:
  # Helm rng — re-generated only on first install. The randAlphaNum result
  # is captured into a Secret so subsequent upgrades reuse it (lookup the
  # existing object instead of regenerating).
  password: {{ (lookup "v1" "Secret" .Release.Namespace (printf "%s-db" (include "xnat.fullname" .))) | dig "data" "password" (randAlphaNum 24 | b64enc) }}
{{- end }}
