{{- if .Values.ingress.enabled -}}
{{/*
Ingress is rendered only when ingress.enabled=true. Pre-requisite: the
matching terraform/eks module was applied with var.enable_ingress_alb=true,
which installs the AWS Load Balancer Controller and creates the IRSA-bound
service account.

When ingress is enabled, set service.type=ClusterIP — the ALB targets the
service directly via target-type=ip.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "xnat.fullname" . }}
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.acmCertificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.acmCertificateArn | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "xnat.fullname" . }}-web
                port:
                  number: {{ .Values.service.port }}
{{- end }}
