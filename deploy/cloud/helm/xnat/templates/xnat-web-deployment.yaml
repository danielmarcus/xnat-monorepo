apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xnat.fullname" . }}
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "xnat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        # Force pod restart on configmap change without changing values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-xnat-conf.yaml") . | sha256sum }}
      labels:
        {{- include "xnat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "xnat.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # Block startup until Postgres TCP is reachable. Cheaper than letting
      # the JVM die mid-Spring-context-init when the DB is missing.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "xnat.databaseHost" . }} {{ .Values.database.port }}; do
                echo "waiting for postgres at {{ include "xnat.databaseHost" . }}:{{ .Values.database.port }}"
                sleep 2
              done

      containers:
        - name: xnat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CATALINA_OPTS
              value: "{{ .Values.javaOpts }} -Dxnat.home=/data/xnat/home -Dxnat.config=/data/xnat/home/config/xnat-conf.properties"
            - name: XNAT_DATASOURCE_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: XNAT_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "xnat.dbSecretName" . }}
                  key: password
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          volumeMounts:
            - name: archive
              mountPath: /data/xnat/archive
            - name: config
              mountPath: /data/xnat/home
              # subPath omitted: we want /data/xnat/home/* (logs, work, plugins)
              # all on the same RWO volume.
            - name: xnat-conf
              mountPath: /data/xnat/home/config/xnat-conf.properties
              subPath: xnat-conf.properties
              readOnly: true

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: {{ include "xnat.fullname" . }}-archive
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "xnat.fullname" . }}-config
        - name: xnat-conf
          configMap:
            name: {{ include "xnat.fullname" . }}-xnat-conf

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
