apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xnat.fullname" . }}
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "xnat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        # Force pod restart on configmap change without changing values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-xnat-conf.yaml") . | sha256sum }}
      labels:
        {{- include "xnat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "xnat.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # Block startup until Postgres TCP is reachable. Cheaper than letting
      # the JVM die mid-Spring-context-init when the DB is missing.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "xnat.databaseHost" . }} {{ .Values.database.port }}; do
                echo "waiting for postgres at {{ include "xnat.databaseHost" . }}:{{ .Values.database.port }}"
                sleep 2
              done

        # Bootstrap the directory tree the WAR expects at /data/xnat/home/*.
        # The Dockerfile creates these at build time, but the config PVC is
        # mounted at /data/xnat/home and overlays everything below — on a
        # fresh PVC the dirs vanish and Tomcat fails WAR deployment with
        # "The directory specified by base and internal path
        # [/data/xnat/home/plugins]/[] does not exist." idempotent on
        # subsequent restarts (mkdir -p is a no-op when dirs exist).
        - name: bootstrap-xnat-home
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /data/xnat/home/plugins /data/xnat/home/logs /data/xnat/home/work /data/xnat/home/config
          volumeMounts:
            - name: config
              mountPath: /data/xnat/home

      containers:
        - name: xnat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Bypass the image's default CMD (jakarta-migrate-and-start.sh ->
          # wait-for-postgres.sh -> catalina.sh) on K8s. Two reasons:
          #   1. The WAR is pre-migrated at image build time, sentinel touched —
          #      jakarta-migrate-and-start.sh would just sentinel-skip and proxy
          #      to wait-for-postgres.sh anyway.
          #   2. wait-for-postgres.sh hardcodes `-h xnat-db` (the docker-compose
          #      service name) and reads PGPASSWORD baked at image build time.
          #      The wait-for-db init container above already gates pod startup
          #      on Postgres TCP reachability via `nc -z`, so the runtime wait
          #      is redundant.
          # Net: skip both shell scripts, run Tomcat directly.
          command: ["/usr/local/tomcat/bin/catalina.sh"]
          args: ["run"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CATALINA_OPTS
              value: "{{ .Values.javaOpts }} -Dxnat.home=/data/xnat/home -Dxnat.config=/data/xnat/home/config/xnat-conf.properties"
            # XNAT_DATASOURCE_USERNAME is set for parity with docker-compose;
            # XNAT itself reads datasource.username from xnat-conf.properties,
            # so this env var is unused at runtime under the bypassed entrypoint.
            - name: XNAT_DATASOURCE_USERNAME
              value: {{ .Values.database.username | quote }}
            # NOTE: There is intentionally NO XNAT_DATASOURCE_PASSWORD env var.
            # XNAT reads datasource.password from xnat-conf.properties (rendered
            # from .Values.database.password by the ConfigMap), and the
            # bypassed entrypoint scripts that used to consume PGPASSWORD don't
            # run on K8s. Setting an env var from a Secret here was dead code.
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          volumeMounts:
            - name: archive
              mountPath: /data/xnat/archive
            - name: config
              mountPath: /data/xnat/home
              # subPath omitted: we want /data/xnat/home/* (logs, work, plugins)
              # all on the same RWO volume.
            - name: xnat-conf
              mountPath: /data/xnat/home/config/xnat-conf.properties
              subPath: xnat-conf.properties
              readOnly: true

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: {{ include "xnat.fullname" . }}-archive
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "xnat.fullname" . }}-config
        - name: xnat-conf
          configMap:
            name: {{ include "xnat.fullname" . }}-xnat-conf

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
